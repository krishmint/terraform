version: 2.1

jobs:
  terraform-check:
    docker:
      - image: cimg/python:3.11  # Includes curl, unzip, and AWS CLI

    steps:
      - checkout

      - run:
          name: Install Terraform 1.8.3
          command: |
            curl -sLo terraform.zip https://releases.hashicorp.com/terraform/1.8.3/terraform_1.8.3_linux_amd64.zip
            mkdir -p tf-bin
            unzip terraform.zip -d tf-bin
            sudo mv -f tf-bin/terraform /usr/local/bin/
            terraform -version

      - run:
          name: Confirm AWS Credentials
          command: |
            echo "Checking AWS identity..."
            aws sts get-caller-identity
          environment:
            AWS_DEFAULT_REGION: us-east-1  # or your actual region

      - run:
          name: Terraform Init
          command: terraform -chdir=terraform init
          environment:
            AWS_DEFAULT_REGION: us-east-1

      - run:
          name: Terraform Validate
          command: terraform -chdir=terraform validate
          environment:
            AWS_DEFAULT_REGION: us-east-1

      - run:
          name: Terraform Plan
          command: terraform -chdir=terraform plan
          environment:
            AWS_DEFAULT_REGION: us-east-1

workflows:
  terraform-validate-and-plan:
    jobs:
      - terraform-check
